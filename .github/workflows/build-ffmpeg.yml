# Raven's LGPL FFmpeg 7.1 build (https://raven.video). Forked from PyAV-Org/pyav-ffmpeg at
# tag 7.1-4 -- the recipe that built the PyPI av==14.2.0 wheel -- with an --lgpl mode in
# scripts/build-ffmpeg.py (community minus x264/x265/gmp/opencore-amr/--enable-version3).
# Only the two platforms Raven ships are built. A tag matching 7.1-*-raven-lgpl* also
# attaches the tarballs to a GitHub Release, which is where Raven's ffmpeg_lgpl/fetch_drop.py
# downloads them from.
#
# A tag matching 7.1-*-raven-gpl-child* builds the OTHER product of this fork instead: the
# --gpl-child mode (a static GPL `ffmpeg` with x264/x265 only -- Raven's out-of-process encoder
# helper, docs/ffmpeg-gpl-lgpl-split-plan.md FS16) and attaches ffmpeg-gpl-child-<platform>.tar.gz
# (bin/ffmpeg, src/ = the corresponding source, CONFIGURE.txt), which Raven's
# gpl_encoder_helper/fetch_helper.py downloads.
name: build-ffmpeg
# Builds on a release tag (one ~1-2 h run per tag, both platforms) or by hand; a branch
# push alone does not build. workflow_dispatch takes the mode as an input.
on:
  push:
    tags: ['7.1-*-raven-lgpl*', '7.1-*-raven-gpl-child*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'recipe mode'
        required: true
        default: 'lgpl'
        type: choice
        options: ['lgpl', 'gpl-child']
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            shell: bash
          - os: windows-latest
            arch: AMD64
            shell: 'msys2 {0}'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set deployment target
        if: matrix.os == 'macos-14'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
      - name: Install packages for macOS
        if: matrix.os == 'macos-14'
        run: |
          brew update
          for f in gettext libidn2 libpng libtiff libunistring libx11 libxau libxcb libxdmcp little-cms2 unbound; do brew unlink $f || true; done
      - uses: msys2/setup-msys2@c52d1fa9c7492275e60fe763540fb601f5f232a1
        if: matrix.os == 'windows-latest'
        with:
          install: base-devel mingw-w64-x86_64-gcc mingw-w64-x86_64-gperf mingw-w64-x86_64-nasm mingw-w64-x86_64-openssl openssl-devel
          path-type: inherit
          release: false
      - name: Pick the recipe mode from the tag
        run: |
          if [[ "${{ github.ref }}" == *raven-gpl-child* || "${{ github.event.inputs.mode }}" == "gpl-child" ]]; then
            echo "RECIPE_MODE=--gpl-child" >> $GITHUB_ENV
          else
            echo "RECIPE_MODE=--lgpl --enable-cuda" >> $GITHUB_ENV
          fi
          tail -1 $GITHUB_ENV
      - name: Build FFmpeg
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_BUILD: python scripts/build-ffmpeg.py /tmp/vendor ${{ env.RECIPE_MODE }}
          CIBW_BEFORE_BUILD_WINDOWS: python scripts\build-ffmpeg.py C:\cibw\vendor ${{ env.RECIPE_MODE }}
          CIBW_BUILD: cp311-*
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:\cibw\vendor\bin -w {dest_dir} {wheel}
          CIBW_SKIP: "*musllinux*"
          CIBW_TEST_COMMAND: python -c "import dummy"
        run: |
          pip install cibuildwheel delvewheel
          cibuildwheel --output-dir output
          rm -f output/*.whl
      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.os }}-${{ matrix.arch }}
          path: output/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.tar.gz
